name: Build Android demo and unsigned iOS app

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which mobile build to prepare
        type: choice
        required: true
        default: both
        options:
          - both
          - android
          - ios

permissions:
  contents: read

concurrency:
  group: thread-mobile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    if: inputs.platform != 'ios'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@0ca7a949e71ae44c8e688a51c5e7e93b2c87e295 # v2.22.0
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Install the pinned Android SDK and NDK
        # These versions match Flutter 3.35.7 and Android Gradle Plugin 8.9.1.
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "ndk;27.0.12077973"

      - name: Install locked Dart dependencies
        run: flutter pub get --enforce-lockfile

      - name: Check Dart sources
        run: flutter analyze --no-pub

      - name: Run Flutter tests
        run: flutter test --no-pub

      - name: Build the installable Android demo
        # The repository uses Android's development certificate when no
        # private release key is configured. This is a demo, not a store build.
        run: flutter build apk --release --no-pub

      - name: Prepare Android download
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/thread-android-demo.apk
          sha256sum dist/thread-android-demo.apk > dist/thread-android-demo.apk.sha256
          printf '%s\n' 'Android demo APK: signed with an ephemeral development certificate. Installing a build from another workflow run may require uninstalling the previous demo, which clears its local data. Production releases need a stable private signing key.' > dist/ANDROID-DEMO.txt

      - name: Upload Android demo APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: thread-android-demo.apk
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Explain Android artifact
        run: |
          printf '%s\n' '### Android demo' 'Download the artifact and extract thread-android-demo.apk to install on Android 8 or newer. This demo uses a development certificate, so a later build may require uninstalling the previous copy. Keep a stable private signing key for production releases.' >> "$GITHUB_STEP_SUMMARY"

  ios:
    if: inputs.platform != 'android'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      COCOAPODS_DISABLE_STATS: 'true'
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Select Xcode 16.4
        run: |
          sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version

      - name: Set up Flutter
        uses: subosito/flutter-action@0ca7a949e71ae44c8e688a51c5e7e93b2c87e295 # v2.22.0
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Install locked Dart dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign --no-pub

      - name: Package unsigned developer artifact
        # Preserve bundle permissions and symlinks. This is deliberately a ZIP,
        # not an IPA: it cannot be installed on an iPhone without Apple signing.
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app dist/thread-ios-unsigned-not-installable.zip
          shasum -a 256 dist/thread-ios-unsigned-not-installable.zip > dist/thread-ios-unsigned-not-installable.zip.sha256
          printf '%s\n' 'This unsigned Runner.app is a developer build artifact, not an installable iPhone app or IPA. Use Xcode with your Apple development team and a device provisioning profile, or a distribution certificate and App Store Connect/TestFlight, to create a signed installable build.' > dist/IOS-NOT-INSTALLABLE.txt

      - name: Upload unsigned iOS developer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: thread-ios-unsigned-not-installable
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Explain iOS artifact
        run: |
          printf '%s\n' '### iOS developer artifact' 'This unsigned app bundle cannot be installed on an iPhone. An Apple development team, signing certificate and provisioning profile are required to produce an installable IPA or TestFlight release.' >> "$GITHUB_STEP_SUMMARY"
