name: Validate and publish guest web app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Refresh the dated RSS snapshot daily, then publish a fresh guest build.
    - cron: '23 5 * * *'

permissions:
  contents: read

concurrency:
  group: thread-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Set up Flutter
        uses: subosito/flutter-action@0ca7a949e71ae44c8e688a51c5e7e93b2c87e295 # v2.22.0
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Install locked Dart dependencies
        run: flutter pub get --enforce-lockfile

      - name: Check Dart sources
        run: flutter analyze --no-pub

      - name: Run Flutter tests
        run: flutter test --no-pub

      - name: Test the RSS publishing pipeline
        run: python -m unittest discover -s tool -p 'test_*.py' -v

      - name: Refresh recent fashion headlines
        if: github.event_name != 'pull_request'
        # An all-source failure intentionally stops this deployment. The
        # currently published site and its dated feed remain available.
        run: python tool/update_trends.py --output web/data/trends.json

      - name: Build the guest experience
        run: python tool/build_guest.py --base-href /Thread_Outfit_Wardrobe_stylists/

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload the guest website
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: build/guest

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the guest website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
