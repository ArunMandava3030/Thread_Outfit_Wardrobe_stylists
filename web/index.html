<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#243D30">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Personal outfit suggestions for your shirt color, proportions, and plans.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Thread">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Thread</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #f8f8f3; }
    #loading { height: 100%; display: grid; place-content: center; text-align: center; color: #243d30; font-family: Arial, sans-serif; }
    #loading img { width: 68px; height: 68px; margin: 0 auto 18px; border-radius: 20px; }
    #loading strong { font-size: 30px; letter-spacing: -1.5px; }
    #loading p { font-size: 13px; color: #657060; }
  </style>
</head>
<body>
  <div id="loading" role="status" aria-live="polite">
    <img src="icons/Icon-192.png" alt="">
    <strong>thread</strong>
    <p>Putting your style studio together…</p>
  </div>
  <script src="vision/thread_pose.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
